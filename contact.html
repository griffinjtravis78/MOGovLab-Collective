<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - MOGovLab Collective</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #222;
            line-height: 1.6;
            background-color: #ffffff;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            border-bottom: 1px solid #eaeaea;
            background-color: #ffffff;
        }
        .brand-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }
        .brand-logo {
            height: 45px;
            width: auto;
        }
        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #002B49;
            letter-spacing: -0.5px;
        }
        nav {
            display: flex;
            gap: 25px;
        }
        nav a {
            text-decoration: none;
            color: #333333;
            font-weight: 500;
            font-size: 16px;
        }
        nav a:hover, nav a.active {
            color: #0066cc;
        }
        .hero-banner {
            background-color: #002B49;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin-bottom: 40px;
            border-radius: 6px;
        }
        .hero-banner h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }
        .hero-banner p {
            margin: 0;
            font-size: 1.1rem;
            color: #d1d5db;
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .contact-form-container {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 6px;
            border: 1px solid #eaeaea;
            margin-bottom: 40px;
        }
        .contact-form-container h2 {
            margin-top: 0;
            color: #002B49;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group textarea {
            height: 150px;
        }
        .btn-submit {
            background-color: #0066cc;
            color: #ffffff;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #004d99;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eaeaea;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title-container">
            <a href="index.html" class="brand-link">
                <img src="Logo_1.png" alt="MOGovLab Collective Logo" class="brand-logo">
                <span class="brand-title">MOGovLab Collective</span>
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="volunteer.html">Volunteer for Research</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <div class="hero-banner">
            <h1>Contact the Collective</h1>
            <p>Reach out to our Advisory Board, research teams, or administrative office.</p>
        </div>

        <div class="contact-form-container">
            <h2>Send Us a Message</h2>
            <!-- Update action with your Formspree endpoint if using Formspree -->
            <form action="https://formspree.io/f/your-form-endpoint" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="_replyto" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MOGovLab Collective. From public records to public progress.</p>
    </footer>

</body>
</html>
