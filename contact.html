<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MOGovLab Collective</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="Logo_1.png" alt="MOGovLab Collective Logo" class="brand-logo">
                <span class="brand-text">MO<span>GovLab</span> Collective</span>
            </a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">About ▾</a></li>
                <li class="nav-item"><a href="impact.html" class="nav-link">Impact ▾</a></li>
                <li class="nav-item"><a href="surveys.html" class="nav-link">Surveys</a></li>
                <li class="nav-item"><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </div>
    </header>
    <main>
        <section class="hero" style="padding: 2.5rem 1rem;">
            <h1>Contact the Collective</h1>
            <p>Reach out to our Advisory Board, research teams, or administrative office.</p>
        </section>
        <div class="card">
            <h2>Send Us a Message</h2>
            <form action="https://formspree.io/f/your-form-id" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="_replyto" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </main>
    <footer><p>&copy; 2026 MOGovLab Collective.</p></footer>
</body>
</html>
